name: Build on various systems
on: push

env:
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:

  Windows:

    strategy:
      matrix:
        os: [windows-2025, windows-11-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: MinGW
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      # Windows ships Postgres 16 by default which is too old.
      # PQclosePrepared' was not declared in this scope and
      # other compilation errors

      - name: PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgresql-version: '18'

      - run: pg_config

      - name: compile
        run: cd untitled && make LIBPQ_LIB=$(pg_config --libdir) LIBPQ_INC=$(pg_config --includedir)
        shell: bash

      - run: ls -l untitled
        shell: bash

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: untitled/*.lib

