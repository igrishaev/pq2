name: Build on various systems
on: push

env:
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:

  windows-x64:
    name: windows
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4
    - name: Set up MinGW
      uses: egor-tensin/setup-mingw@v3
      with:
        platform: x64
    - name: aaa
      run: g++ --version
    - name: Setup PostgreSQL
      uses: ikalnytskyi/action-setup-postgres@v8
      with:
        postgresql-version: '18' # Specify your desired version
        # Other optional parameters:
        # username: ci
        # password: sw0rdfish
        # database: test
    - name: compile
      run: cd untitled && g++ -c -fPIC -I${JAVA_HOME}/include -I${JAVA_HOME}/include/win32 -IC:/PROGRA~1/POSTGR~1/18/include org_pq_Native.cpp -o org_pq_Native.o
      shell: bash
    - name: bar
      run: echo $PG_LIBDIR
      shell: bash
    - name: foo
      run: echo $PROGRAMFILES
      shell: bash
    - name: foo2
      run: dir C:/PROGRA~1/POSTGR~1/18/lib
    - name: foo3
      run: dir C:/PROGRA~1/POSTGR~1/18/include

  mac-intel:
    name: "Mac OS Intel"
    runs-on: macos-15-intel

    env:
      LIBPQ: /usr/local/opt/libpq

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Homebrew & stuff
        run: |
          brew update
          brew install gh
          brew install libpq

      - name: compile
        run: |
          cd untitled && make

      - run: ls -l untitled

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foo
          path: untitled/libfoo.dylib

  mac-m1:
    name: "Mac OS M1"
    runs-on: macos-26

    env:
      LIBPQ: /opt/homebrew/opt/libpq

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Homebrew & stuff
        run: |
          brew update
          brew install gh
          brew install libpq

      - name: compile
        run: |
          cd untitled && make

      - run: ls -l untitled

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_aarch64.lib
          path: untitled/macos_aarch64.lib
