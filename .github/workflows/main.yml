name: Build on various systems
on: push

env:
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:

  Windows-arm64:

    strategy:
      matrix:
        os:
          - name: windows-11-arm

    runs-on: ${{ matrix.os.name }}

    steps:

      - name: Check out
        uses: actions/checkout@v4

      - run: g++ --version

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64

      - run: g++ --version

      - run: vcpkg install libpq

      - run: ls -l ${VCPKG_INSTALLATION_ROOT}/installed
        shell: bash

      - name: compile
        run: cd untitled && make LIBPQ_LIB=${VCPKG_INSTALLATION_ROOT}/installed/arm64-windows/lib LIBPQ_INC=${VCPKG_INSTALLATION_ROOT}/installed/arm64-windows/include
        # run: cd untitled && make LIBPQ_LIB=${VCPKG_INSTALLATION_ROOT}/installed/arm64-windows/lib LIBPQ_INC=${VCPKG_INSTALLATION_ROOT}/installed/arm64-windows/include
        # run: cd untitled && make LIBPQ_LIB=$(pg_config --libdir) LIBPQ_INC=$(pg_config --includedir)
        shell: bash

      - run: ls -l untitled
        shell: bash

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os.name }}
          path: untitled/*.lib

