name: Build on macOS
on: [push]

jobs:
  build:
    name: "Mac OS Build"
    runs-on: macos-15-intel # macos-26 macos-15-intel

    steps:
    - name: foo
      run: ls -l ${JAVA_HOME}include

    - name: Check out repository code
      uses: actions/checkout@v4 # Use actions/checkout@v4 (or a later version)

    - name: Update Homebrew and install a formula (e.g., GitHub CLI)
      run: |
        brew update
        brew install gh # Installs the GitHub CLI
      # Homebrew is located in the PATH, so 'brew' commands work directly

    - name: Install libpq
      run: |
        brew install libpq

    - name: compile
      run: |
        cd untitled && make

    - name: save file
      uses: actions/upload-artifact@v4
      with:
        name: the_lib
        path: untitled/libfoo.dylib
