name: Build on various systems
on: push

env:
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:

  Windows-x64:
    name: Windows x64
    runs-on: windows-2025

    env:
      LIBPQ: "C:/PROGRA~1/POSTGR~1/18"

    steps:
      - uses: actions/checkout@v4
      - name: MinGW
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      # Windows ships Postgres 16 by default which is too old.
      # PQclosePrepared' was not declared in this scope and
      # other compilation errors

      - name: PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgresql-version: '18'

      - run: pg_config

      - name: compile
        run: cd untitled && make LIBPQ_LIB=$(pg_config --libdir) LIBPQ_INC=$(pg_config --includedir)
        shell: bash

      - run: ls -l untitled
        shell: bash

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: untitled/*.lib

  macOS:
    name: "macOS Intel"

    strategy:
      matrix:
        os: [macos-15-intel, macos-26]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install libpq
        run: |
          brew update
          brew install libpq

      - name: compile
        run: |
          cd untitled && make LIBPQ_LIB=$(pg_config --libdir) LIBPQ_INC=$(pg_config --includedir)

      - run: ls -l untitled

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: untitled/*.lib

  Linux-x64:
    name: "Linux x64"
    runs-on: ubuntu-24.04

    env:
      LIBPQ: /usr/lib

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install libpq
        run: |
          sudo apt update
          sudo apt install -y libpq-dev

      - run: pg_config

      - name: compile
        run: |
          cd untitled && make LIBPQ_LIB=$(pg_config --libdir) LIBPQ_INC=$(pg_config --includedir)

      - run: ls -l untitled

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-x64
          path: untitled/*.lib
