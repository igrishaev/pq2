name: Build on various systems
on: push

env:
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:

  Windows:

    strategy:
      matrix:
        os:
          - name: windows-2025
            sys: mingw64
            env: x86_64
          # - name: windows-11-arm

    runs-on: ${{ matrix.os.name }}

    steps:

      - name: Check out
        uses: actions/checkout@v4

      # - name: Setup MSYS2
