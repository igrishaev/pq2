name: Build on various systems
on: push

# todo: move to macos
env:
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:

  Windows-arm64:

    runs-on: windows-11-arm

    steps:

      - name: Check out
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          install: >-
            make
            mingw-w64-clang-aarch64-libpqxx
            mingw-w64-clang-aarch64-gcc-compat

      - name: set env vars
        run: cd untitled && echo "FILENAME=$(make filename)" >> $GITHUB_ENV
        shell: bash

      - name: Compile the project
        shell: msys2 {0}
        run: |
          g++ --version
          cd untitled
          make compile

      - run: ls -l untitled
        shell: bash

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows-arm64
          path: untitled/*.lib
          if-no-files-found: error

  Windows-x64:

    runs-on: windows-2025

    steps:

      - name: Check out
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            make
            mingw-w64-clang-x86_64-libpqxx
            mingw-w64-clang-x86_64-gcc-compat

      - name: set env vars
        run: cd untitled && echo "FILENAME=$(make filename)" >> $GITHUB_ENV
        shell: bash

      - name: Compile the project
        shell: msys2 {0}
        run: |
          g++ --version
          cd untitled
          make compile

      - run: ls -l untitled
        shell: bash

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows-x64
          path: untitled/*.lib
          if-no-files-found: error

