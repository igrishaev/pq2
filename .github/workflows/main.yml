      #     platform: x64

      # - run: g++ --version

      # Windows ships Postgres 16 by default which is too old.
      # PQclosePrepared' was not declared in this scope and
      # other compilation errors

      # - name: PostgreSQL
      #   uses: ikalnytskyi/action-setup-postgres@v8
      #   with:
      #     postgresql-version: '18'

      - run: pg_config

      - run: dir "C:\Program Files\PostgreSQL\17"
        shell: cmd

      - name: compile
        run: cd untitled && make LIBPQ_LIB=C:/PROGRA~1/PostgreSQL/17/lib LIBPQ_INC=C:/PROGRA~1/PostgreSQL/17/include
        shell: bash

      - run: ls -l untitled
        shell: bash

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os.name }}
          path: untitled/*.lib

