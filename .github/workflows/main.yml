  mac-intel:
    name: "Mac OS Intel"
    runs-on: macos-15-intel

    env:
      LIBPQ: /usr/local/opt/libpq

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Homebrew & stuff
        run: |
          brew update
          brew install libpq

      - name: compile
        run: |
          cd untitled && make

      - run: ls -l untitled

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_x86_64.lib
          path: untitled/macos_x86_64.lib

  mac-m1:
    name: "Mac OS M1"
    runs-on: macos-26

    env:
      LIBPQ: /opt/homebrew/opt/libpq

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Homebrew & stuff
        run: |
          brew update
          brew install libpq

      - name: compile
        run: |
          cd untitled && make

      - run: ls -l untitled

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_aarch64.lib
          path: untitled/macos_aarch64.lib

  linux-x64:
    name: "Linux x64"
    runs-on: ubuntu-24.04

    env:
      LIBPQ: /usr/lib

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install libpq
        run: |
          sudo apt update
          sudo apt install -y libpq-dev

      - run: pg_config

      - name: compile
        run: |
          cd untitled && make LIBPQ_LIB=/usr/lib/x86_64-linux-gnu LIBPQ_INC=/usr/include/postgresql

      - run: ls -l untitled

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foo
          path: untitled/foo
