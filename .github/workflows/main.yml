name: Build on various systems
on: push

# todo: move to macos
env:
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:

  Windows:

      matrix:
        opt:
          - image: windows-11-arm
            msys: CLANGARM64
            env: clang-aarch64
          - image: windows-2025
            msys: CLANG64
            env: clang-x86_64

    runs-on: ${{ matrix.opt.image }}

    steps:

      - name: Check out
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.opt.msys }}
          install: >-
            make
            mingw-w64-${{ matrix.opt.env }}-libpqxx
            mingw-w64-${{ matrix.opt.env }}-gcc-compat

      - name: prepare files
        run: ./script/platform.sh
        shell: bash

      - name: Compile the project
        shell: msys2 {0}
        run: |
          g++ --version
          ./script/build-windows.sh

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.opt.image }}
          path: "*.dll"
          if-no-files-found: error

